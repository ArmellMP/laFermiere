# Intégration continue : compile la solution et lance tous les tests (API et front-end)
# à chaque pull request vers master et à chaque push sur master.
#
# Les tests d'intégration ont besoin d'une vraie base : un conteneur MariaDB 10.4
# (même version que XAMPP en local) est démarré à côté du job. Ils y recréent eux-mêmes
# la base lafermiere_tests à partir de database/schema.sql.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:   # lancement manuel depuis l'onglet Actions

# Un nouveau push sur la même branche annule l'exécution précédente, devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-et-tests:
    name: Compilation et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:10.4
        env:
          # Mot de passe jetable : la base n'existe que le temps du job
          MARIADB_ROOT_PASSWORD: ci-root
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurer les paquets
        run: dotnet restore laFermiere.slnx

      - name: Compiler
        run: dotnet build laFermiere.slnx --configuration Release --no-restore

      - name: Tests unitaires
        run: dotnet test --project tests/LaFermiere.UnitTests --configuration Release --no-build

      - name: Tests d'intégration (MariaDB)
        env:
          # Lue par BaseDeTest : la base lafermiere_tests est (re)créée sur ce serveur
          LAFERMIERE_TEST_DB_CONNECTION: Server=127.0.0.1;Port=3306;User=root;Password=ci-root;CharSet=utf8mb4;AllowUserVariables=true
        run: dotnet test --project tests/LaFermiere.IntegrationTests --configuration Release --no-build

  front-end:
    name: Front-end (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances (versions exactes du package-lock)
        run: npm ci

      - name: Tests (Vitest)
        run: npm test

      - name: Vérification des types et build de production
        run: npm run build

  kit-mise-en-ligne:
    name: Kit de mise en ligne (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploiement

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer un .env de test (domaine localhost, certificat interne de Caddy)
        run: |
          bash preparer.sh
          sed -i \
            -e 's/^DOMAINE=.*/DOMAINE=localhost/' \
            -e 's/^ADMIN_EMAIL=.*/ADMIN_EMAIL=gerant@test.local/' \
            -e 's/^ADMIN_NOM=.*/ADMIN_NOM=Gerant CI/' \
            -e 's/^ADMIN_MOT_DE_PASSE=.*/ADMIN_MOT_DE_PASSE=Serveur2026x/' \
            .env

      - name: Construire les images et démarrer (base neuve depuis schema.sql)
        run: docker compose up -d --build

      - name: Vérifier (https, application, base, compte admin remplacé, limite de connexion)
        run: bash verifier.sh --complet

      - name: Sauvegarder la base
        run: |
          docker compose exec -T sauvegarde bash /scripts/sauvegarder.sh --une-fois
          copie=$(ls -t sauvegardes/lafermiere-*.sql.gz | head -1)
          # mariadb-dump écrit « /*!50003 CREATE*/ … TRIGGER nom » : on cherche les noms
          zcat "$copie" | grep -q "trg_after_achat_insert" || { echo "Triggers absents de la sauvegarde"; exit 1; }
          zcat "$copie" | grep -q "sp_ajuster_stock_achat" || { echo "Procédures absentes de la sauvegarde"; exit 1; }
          zcat "$copie" | grep -q "gerant@test.local" || { echo "Compte admin absent de la sauvegarde"; exit 1; }
          sudo cp "$copie" import/lafermiere.sql.gz

      - name: Restaurer la sauvegarde sur un serveur neuf, puis revérifier
        run: |
          docker compose down --volumes
          docker compose up -d
          bash verifier.sh

      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs --no-color --tail=200
